services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: anvil
    environment:
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      MNEMONIC: ${MNEMONIC}
    working_dir: /anvil
    ports:
      - "8545:8545"
    command: 'anvil --mnemonic "${MNEMONIC}" --fork-url https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY} --fork-block-number 23377946'
